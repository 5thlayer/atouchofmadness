modLoader = "javafml"
loaderVersion = "[4,)"
issueTrackerURL = "https://github.com/5thlayer/${mod_id}/issues"
license = "LGPL-3.0-only"

# processResources fills each dollar-brace value from gradle.properties, so this file names
# nothing of the Module's own.
[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "5thlayer"
description = '''
${mod_description}
'''

# Read only by the client, to draw a Shadow Creature's Shape as a shadow (#11).
[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

# A Touch Of's Runtime, nested in the jar, which draws the Sanity meter (#15).
[[dependencies.${mod_id}]]
modId = "atouchof"
type = "required"
versionRange = "[0.1.0,0.2)"
ordering = "AFTER"
side = "BOTH"

# Shows a playing jukebox's disc freshness, once discovered, in Jade's tooltip (#19). Not required: its
# plugin is only loaded by Jade. The range is the Jade the plugin is compiled against.
[[dependencies.${mod_id}]]
modId = "jade"
type = "optional"
versionRange = "[26.1.11,)"
ordering = "NONE"
side = "BOTH"

# Shows the Pillar's information pages, as far as the player has discovered them, in EMI (#19). Not
# required: its plugin is only loaded by EMI.
[[dependencies.${mod_id}]]
modId = "emi"
type = "optional"
versionRange = "[0,)"
ordering = "NONE"
side = "CLIENT"
