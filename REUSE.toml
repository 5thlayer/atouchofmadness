version = 1

# Code is LGPL-3.0-only, the mod's own content and prose are CC BY 4.0, and whatever is not the
# suite's own keeps the licence it came with (A Touch Of ADR-0001). Java files carry their own SPDX
# headers; this file marks everything that can't hold one. The last annotation matching a file
# wins, so the general rules come first and the exceptions after them.

# Code, and the files a program reads as instructions.
[[annotations]]
path = [
    "**/*.gradle",
    "**/gradle.properties",
    ".gitignore",
    ".gitattributes",
    ".claude/settings.json",
    ".claude/hooks/*.sh",
    "**/*.mods.toml",
    "**/src/main/resources/**/*.mcfunction",
    "**/src/gametest/resources/**/*.mcfunction",
    ".github/**",
]
SPDX-FileCopyrightText = "2026 5thlayer"
SPDX-License-Identifier = "LGPL-3.0-only"

# The mod's own content and prose: docs, the glossary, the ADRs, and the datapack and resources,
# its textures among them.
[[annotations]]
path = [
    "**/*.md",
    "**/src/main/resources/**/*.json",
    "**/src/main/resources/**/*.png",
    "**/src/gametest/resources/**/*.json",
    "**/src/main/resources/**/*.mcmeta",
    "**/src/gametest/resources/**/*.mcmeta",
    "**/src/main/resources/**/*.nbt",
    "**/src/gametest/resources/**/*.nbt",
    "LICENSE",
    "NOTICE",
]
SPDX-FileCopyrightText = "2026 5thlayer"
SPDX-License-Identifier = "CC-BY-4.0"

# The agent skills, from mattpocock/skills.
[[annotations]]
path = [".claude/skills/**", ".gitmodules"]
precedence = "override"
SPDX-FileCopyrightText = "Matt Pocock"
SPDX-License-Identifier = "MIT"

# Malcolm Riley's unused textures (https://github.com/malcolmriley/unused-textures), credited in NOTICE.
# The unmodified copies under data/art/ are his; a texture scripts/build-textures.py builds from them is
# both his and ours. Module CI runs that script's --check.
[[annotations]]
path = ["data/art/*.png"]
precedence = "override"
SPDX-FileCopyrightText = "Malcolm Riley"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = [
    "src/main/resources/assets/atouchofmadness/textures/item/umbra_sword.png",
    "src/main/resources/assets/atouchofmadness/textures/item/umbra_pickaxe.png",
    "src/main/resources/assets/atouchofmadness/textures/item/umbra_helmet.png",
    "src/main/resources/assets/atouchofmadness/textures/item/umbra_chestplate.png",
    "src/main/resources/assets/atouchofmadness/textures/item/umbra_leggings.png",
    "src/main/resources/assets/atouchofmadness/textures/item/umbra_boots.png",
]
precedence = "override"
SPDX-FileCopyrightText = ["Malcolm Riley", "2026 5thlayer"]
SPDX-License-Identifier = "CC-BY-4.0"

# The Gradle wrapper is Gradle's.
[[annotations]]
path = ["gradlew", "gradlew.bat", "gradle/wrapper/**"]
precedence = "override"
SPDX-FileCopyrightText = "Gradle"
SPDX-License-Identifier = "Apache-2.0"
