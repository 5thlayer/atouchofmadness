version = 1

# Code is LGPL-3.0-only, the mod's own content and prose are CC BY 4.0, and whatever is not the
# suite's own keeps the licence it came with (A Touch Of ADR-0001). Java files carry their own SPDX
# headers; this file marks everything that can't hold one. The last annotation matching a file
# wins, so the general rules come first and the exceptions after them.

# Code, and the files a program reads as instructions.
[[annotations]]
path = [
    "**/*.gradle",
    "**/gradle.properties",
    ".gitignore",
    ".gitattributes",
    ".claude/settings.json",
    ".claude/hooks/*.sh",
    "**/*.mods.toml",
    "**/src/main/resources/**/*.mcfunction",
    "**/src/gametest/resources/**/*.mcfunction",
    ".github/**",
]
SPDX-FileCopyrightText = "2026 5thlayer"
SPDX-License-Identifier = "LGPL-3.0-only"

# The mod's own content and prose: docs, the glossary, the ADRs, and the datapack and resources.
[[annotations]]
path = [
    "**/*.md",
    "**/src/main/resources/**/*.json",
    "**/src/gametest/resources/**/*.json",
    "**/src/main/resources/**/*.mcmeta",
    "**/src/gametest/resources/**/*.mcmeta",
    "**/src/main/resources/**/*.nbt",
    "**/src/gametest/resources/**/*.nbt",
    "LICENSE",
    "NOTICE",
]
SPDX-FileCopyrightText = "2026 5thlayer"
SPDX-License-Identifier = "CC-BY-4.0"

# The agent skills, from mattpocock/skills.
[[annotations]]
path = [".claude/skills/**", ".gitmodules"]
precedence = "override"
SPDX-FileCopyrightText = "Matt Pocock"
SPDX-License-Identifier = "MIT"

# Third-party art, such as Malcolm Riley's unused textures
# (https://github.com/malcolmriley/unused-textures), takes an override stanza of its own and an
# entry in NOTICE that credits it. Unmodified copies, those a texture is built from under data/art/
# included, are the author's; a texture scripts/build-textures.py builds from them is both. Module
# CI runs that script's --check when it exists. Uncommenting a stanza needs the licence's text in
# LICENSES/ (reuse download CC-BY-4.0), which reuse lint refuses while no file uses it.
#
# [[annotations]]
# path = [
#     "data/art/*.png",
#     "src/main/resources/assets/atouchofmadness/textures/block/plating/*.png",
# ]
# precedence = "override"
# SPDX-FileCopyrightText = "Malcolm Riley"
# SPDX-License-Identifier = "CC-BY-4.0"
#
# [[annotations]]
# path = ["src/main/resources/assets/atouchofmadness/textures/block/machine/front.png"]
# precedence = "override"
# SPDX-FileCopyrightText = ["Malcolm Riley", "2026 5thlayer"]
# SPDX-License-Identifier = "CC-BY-4.0"

# The Gradle wrapper is Gradle's.
[[annotations]]
path = ["gradlew", "gradlew.bat", "gradle/wrapper/**"]
precedence = "override"
SPDX-FileCopyrightText = "Gradle"
SPDX-License-Identifier = "Apache-2.0"
